<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pebbles</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<style>
/* Layout: warm hardware-grey page on a faint dot grid; a black display panel reads the current pebble; one horizontal day strip of soft key-like pebbles; the selected pebble unfolds into a hairline drawer below. */
:root{
  --bg:#EFEFEC; --panel:#F7F7F5; --ink:#161616; --muted:#77777A; --line:#D5D5D0; --hair:#E2E2DD; --dotc:#CFCFCA;
  --key-a:#FBFBF9; --key-b:#E9E9E5; --key-edge:#CFCFC9; --key-ink:#161616;
  --screen:#0B0B0B; --screen-ink:#F2F2F2; --screen-dim:#5B5B5B;
  --hi:#E4E4E0; --hi-ink:#161616; --hov:color-mix(in srgb,var(--ink) 55%,transparent); --red:#E5322D; --elec:#14C8FF; --pill:#161616; --pill-ink:#F7F7F5;
  --g0:#FF2E2E; --g1:#FF2D6F; --g2:#F0329F; --g3:#C63CE6; --g4:#8A47FF; --g5:#2F6BFF; --g6:#1696FF; --g7:#FFC21A;
  --k-break:#A7A7A1; --k-move:#3E3E3B;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.45,.64,1);
  --f-ui:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --panel:#151515; --ink:#EDEDEA; --muted:#8B8B88; --line:#2A2A28; --hair:#1F1F1E; --dotc:#262625;
  --key-a:#2A2A29; --key-b:#1F1F1E; --key-edge:#101010; --key-ink:#EDEDEA;
  --screen:#000000; --screen-ink:#F2F2F2; --screen-dim:#4A4A4A;
  --hi:#222221; --hi-ink:#EDEDEA; --red:#FF4A3D; --pill:#EDEDEA; --pill-ink:#0E0E0E;
  --g0:#FF5757; --g1:#FF5C8D; --g2:#F55BB4; --g3:#D466F0; --g4:#A06BFF; --g5:#5C8CFF; --g6:#45AEFF; --g7:#FFD050;
  --k-break:#6E6E6A; --k-move:#BDBDB8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --panel:#151515; --ink:#EDEDEA; --muted:#8B8B88; --line:#2A2A28; --hair:#1F1F1E; --dotc:#262625;
  --key-a:#2A2A29; --key-b:#1F1F1E; --key-edge:#101010; --key-ink:#EDEDEA;
  --screen:#000000; --screen-ink:#F2F2F2; --screen-dim:#4A4A4A;
  --hi:#222221; --hi-ink:#EDEDEA; --red:#FF4A3D; --pill:#EDEDEA; --pill-ink:#0E0E0E;
  --g0:#FF5757; --g1:#FF5C8D; --g2:#F55BB4; --g3:#D466F0; --g4:#A06BFF; --g5:#5C8CFF; --g6:#45AEFF; --g7:#FFD050;
  --k-break:#6E6E6A; --k-move:#BDBDB8; color-scheme:dark}

[data-sty]{--pc:var(--k-break)} [data-sty="line"],[data-sty="solid"]{--pc:var(--k-move)}
[data-sty="dots"]{--pats:radial-gradient(circle,var(--muted) .7px,transparent 1px) 1px 1px/3px 3px;--pat:radial-gradient(circle,var(--muted) .9px,transparent 1.3px) 3px 3px/7px 7px}
[data-sty="diag"]{--pats:repeating-linear-gradient(45deg,var(--muted) 0 1px,transparent 1px 3px);--pat:repeating-linear-gradient(45deg,var(--muted) 0 1px,transparent 1px 6px)}
[data-sty="cross"]{--pats:repeating-linear-gradient(45deg,var(--muted) 0 .8px,transparent .8px 3.5px),repeating-linear-gradient(-45deg,var(--muted) 0 .8px,transparent .8px 3.5px);--pat:repeating-linear-gradient(45deg,var(--muted) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,var(--muted) 0 1px,transparent 1px 7px)}
[data-sty="hlines"]{--pats:repeating-linear-gradient(0deg,var(--muted) 0 1px,transparent 1px 3px);--pat:repeating-linear-gradient(0deg,var(--muted) 0 1px,transparent 1px 5px)}
[data-sty="vlines"]{--pats:repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 3px);--pat:repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 5px)}
[data-sty="grid"]{--pats:repeating-linear-gradient(0deg,var(--muted) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 4px);--pat:repeating-linear-gradient(0deg,var(--muted) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 7px)}
[data-sty="check"]{--pats:conic-gradient(var(--muted) 25%,transparent 0 50%,var(--muted) 0 75%,transparent 0) 0 0/4px 4px;--pat:conic-gradient(color-mix(in srgb,var(--muted) 45%,transparent) 25%,transparent 0 50%,color-mix(in srgb,var(--muted) 45%,transparent) 0 75%,transparent 0) 0 0/8px 8px} [data-kind="trans"]{--pc:var(--line)}
[data-g="0"]{--pc:var(--g0)} [data-g="1"]{--pc:var(--g1)} [data-g="2"]{--pc:var(--g2)} [data-g="3"]{--pc:var(--g3)}
[data-g="4"]{--pc:var(--g4)} [data-g="5"]{--pc:var(--g5)} [data-g="6"]{--pc:var(--g6)} [data-g="7"]{--pc:var(--g7)}

body{background:var(--bg) radial-gradient(circle,var(--dotc) 1px,transparent 1.3px) 0 0/22px 22px;color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:26px 120px;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.box{border:1px solid var(--line);border-radius:14px;background:var(--panel)}

/* header */
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding:0 2px 4px}
.mark{font-size:24px;font-weight:500;letter-spacing:-.01em;margin:0;line-height:1;display:flex;align-items:baseline;gap:12px}
.mark small{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400}
nav.top{display:flex;gap:4px;flex-wrap:wrap}
nav.top button{font-size:15px;padding:4px 10px;border-radius:99px;color:var(--muted);transition:color .15s ease-out,background .15s ease-out}
nav.top button:hover{color:var(--ink)}
nav.top button.upd{color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
nav.top button.upd:hover{color:#fff;background:var(--red)}
nav.top button.on{color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}

/* now: the black display */
.now{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.screen{background:var(--screen);color:var(--screen-ink);border-radius:14px;padding:14px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.scr-top{display:flex;align-items:center;gap:8px;color:var(--screen-dim);min-width:0;grid-column:1/-1}
.scr-top span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--screen-dim));flex:none;transition:background .3s}
.now.is-wrap .rec{background:var(--red);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.scr-name{font-size:24px;font-weight:500;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;align-self:end;color:var(--screen-ink)}
.scr-name:hover{opacity:.75}
.scr-count{font-family:var(--f-dot);font-weight:800;font-size:46px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:.02em;grid-row:2/4;grid-column:2;align-self:center;text-align:right}
.scr-next{color:var(--screen-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0;font-size:13px}
.scr-next b{color:var(--screen-ink);font-weight:400}
.dots{grid-column:1/-1;display:grid;grid-template-columns:repeat(60,minmax(0,1fr));gap:3px;margin-top:8px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--screen-dim);opacity:.45;transition:background .5s var(--ease),opacity .5s var(--ease)}
.dots i.on{background:var(--screen-ink);opacity:1}
.now.is-wrap .dots i.on{background:var(--red)}
.keys{display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:68px;gap:8px;align-self:end}
.key{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:9px 10px;border-radius:12px;background:linear-gradient(var(--key-a),var(--key-b));box-shadow:inset 0 0 0 1px var(--key-edge),0 1px 0 var(--key-edge);color:var(--key-ink);font-size:15px;font-weight:500;text-align:left;transition:transform .12s var(--ease),box-shadow .12s}
.key small{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.key:active{transform:translateY(1px);box-shadow:inset 0 0 0 1px var(--key-edge)}
.key.dark{background:var(--ink);color:var(--bg);box-shadow:none}
.key.dark small{color:var(--muted)}
.keys[hidden]{display:none!important}
.now:has(.keys[hidden]){grid-template-columns:minmax(0,1fr)}

/* alerts */
.alerts{padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.alerts .cap{color:var(--red);display:flex;align-items:center;gap:8px}
.alerts .cap::before{content:"";width:7px;height:7px;background:var(--red);border-radius:1px}
.day .mono.over{color:var(--red)}
.freebook{color:var(--screen-dim);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--screen-dim)}.freebook b{color:var(--screen-ink);font-weight:400}.freebook:hover{color:var(--screen-ink)}
.runs{color:var(--muted)}
.fsbanner .cap{color:var(--ink)}.fsbanner .cap::before{background:var(--ink)}
.pipbtn{margin-left:auto;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--screen-dim);padding:1px 6px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--screen-dim)}.pipbtn:hover{color:var(--screen-ink);box-shadow:inset 0 0 0 1px var(--screen-ink)}
.pipbody{margin:0;background:var(--screen);overflow:hidden}
.pip{border-radius:0;height:100vh;box-sizing:border-box;display:flex!important;flex-direction:column;gap:6px;padding:10px 12px!important}
.pip-top{display:flex;align-items:center;gap:8px;color:var(--screen-dim)}.pip-top .phase{margin-left:auto;width:auto!important;padding:1px 6px}
.pip-name{font-size:17px;font-weight:700;color:var(--screen-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pip-mid{display:flex;align-items:center;gap:10px;min-height:30px}.pip-mid .pd{margin-left:auto;--d:4px!important;gap:5px!important}
.pip .now-dd,.pip .dd-wrap{--dc:var(--screen-ink)}.pip.is-wrap .dd-wrap{--dc:var(--red)}.pip.is-break .dd-wrap{--dc:var(--elec)}
.pip-task{display:flex;align-items:center;gap:8px;color:var(--screen-ink);font-size:13px;min-width:0}.pip-task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pip-task input{appearance:none;width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--screen-ink);margin:0;flex:none}.pip-task input:checked{background:var(--screen-ink)}
.pip-bar{height:3px;border-radius:2px;background:var(--screen-dim);overflow:hidden}.pip-bar i{display:block;height:100%;background:var(--screen-ink)}.pip.is-wrap .pip-bar i{background:var(--red)}.pip.is-break .pip-bar i{background:var(--elec)}
.pip-acts{display:flex!important;flex-direction:row!important;gap:6px;margin-top:auto}.pip-acts .step{flex:1.2}.pip-acts>button{flex:1;min-width:0!important;padding:3px 0}
.review .cap{color:var(--ink)}.review .cap::before{background:var(--ink);border-radius:50%}
.review .alert .acts2{display:flex;gap:6px}.review .alert .acts2 .pill{padding:3px 10px}
.review .clr{align-self:flex-end;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.task .rs{font-family:var(--f-mono);font-size:10px;color:var(--red);flex:none;align-self:center;margin-left:4px}
.alert{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--hair)}
.alert:first-of-type{border-top:0}
.alert .what{display:flex;gap:8px;align-items:baseline;min-width:0}
.alert em{font-style:normal;color:var(--muted)}
.sw{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--line));flex:none;align-self:center}

/* week */
.week{display:grid;grid-template-columns:34px minmax(0,1fr) 34px 38px;overflow:hidden}
.wk.home{display:grid;place-items:center;border-left:1px solid var(--line);border-radius:0 10px 10px 0}
.wk.home{color:var(--ink)}
.wk.home svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.wk.home.here{color:var(--muted)}
.wk{color:var(--muted);font-size:18px;border-radius:8px;transition:box-shadow .15s ease-out}
.wk:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--hov)}
.days{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));border-inline:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar,.scroller::-webkit-scrollbar{display:none}
.day{display:flex;flex-direction:row;align-items:baseline;gap:8px;padding:6px 12px;white-space:nowrap;text-align:left;border-left:1px solid var(--line);transition:box-shadow .15s ease-out}
.day:first-child{border-left:0}
.day b{font-weight:500;font-size:16px;display:flex;align-items:center;gap:6px;text-transform:lowercase;white-space:nowrap}
.day.today b::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--red)}
.day .mono{color:var(--muted)}
.day:hover{box-shadow:inset 0 0 0 1px var(--hov)}
.day.on{background:var(--ink);color:var(--bg)}
.day.on .mono{color:var(--muted)}
.day.past:not(.on) b{color:var(--muted)}

/* add chips: small keys */
.adds{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;border-radius:10px;padding:6px 12px 6px 10px;font-size:15px;background:linear-gradient(var(--key-a),var(--key-b));box-shadow:inset 0 0 0 1px var(--key-edge),0 1px 0 var(--key-edge);touch-action:none;user-select:none;transition:transform .12s var(--ease)}
.chip:hover{transform:translateY(-1px)}
.chip:active{transform:translateY(1px)}
.chip .sw{border-radius:50%}
[data-sty] .sw,.chip[data-sty] .sw,.pebble[data-sty] .sw{border-radius:3px}
.chip.addm{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.ghost{position:fixed;z-index:50;pointer-events:none;height:66px;border-radius:14px;background:linear-gradient(var(--key-a),var(--key-b));box-shadow:0 0 0 1px var(--key-edge),0 14px 30px rgba(0,0,0,.14);padding:10px 12px;font-weight:500;color:var(--key-ink);display:flex;gap:8px;align-items:flex-start}

/* timeline */
.calrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--muted);min-height:22px;margin-bottom:8px;font-size:14px;padding:0 2px}
.calrow .allday{border:1px dashed var(--muted);border-radius:6px;padding:0 8px;color:var(--ink)}
.timeline{overflow:hidden}
.scroller{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;background:radial-gradient(circle,var(--dotc) 1px,transparent 1.3px) 0 0/14px 14px}
.track{position:relative;height:136px}
.track.slide-l{animation:slidel .42s var(--ease)}.track.slide-r{animation:slider .42s var(--ease)}
@keyframes slidel{from{opacity:0;transform:translateX(-28px)}}@keyframes slider{from{opacity:0;transform:translateX(28px)}}
.hr{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);transition:left .42s var(--ease)}
.hr span{position:absolute;bottom:7px;left:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;text-transform:uppercase}
.calev{position:absolute;top:7px;height:22px;box-sizing:border-box;border-radius:6px;border:1px dashed var(--muted);background:var(--panel);font-size:12px;line-height:20px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;transition:left .42s var(--ease),width .42s var(--ease)}
.calev.free{opacity:.5}
.calev b{font-family:var(--f-mono);font-weight:400;font-size:10px;margin-right:5px;color:var(--muted)}
.pebble{position:absolute;top:34px;height:72px;box-sizing:border-box;border-radius:14px;background:linear-gradient(var(--key-a),var(--key-b));box-shadow:inset 0 0 0 1px var(--key-edge),0 1px 0 var(--key-edge);color:var(--key-ink);padding:10px 12px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;
  transition:left .42s var(--ease),width .42s var(--ease),height .38s var(--ease),border-radius .38s var(--ease),background .25s,color .25s,box-shadow .25s,transform .25s var(--ease)}
.pebble:hover{transform:translateY(-1px)}
.pebble[data-sty]:not([data-sty="line"]):not([data-sty="solid"]){background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.pebble[data-sty]:not([data-sty="line"]):not([data-sty="solid"])::before{content:"";position:absolute;inset:0;background:var(--pat);opacity:.8;-webkit-mask-image:linear-gradient(to bottom,transparent 52%,#000 78%);mask-image:linear-gradient(to bottom,transparent 52%,#000 78%);pointer-events:none}
.pebble[data-sty].sel::before{opacity:.3}
.pebble[data-sty="line"]{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--k-move)}
.pebble[data-sty="solid"]{background:var(--hi);box-shadow:none}
.pebble.dragging{cursor:grabbing;z-index:6;transition:height .38s var(--ease),transform .2s var(--ease),box-shadow .2s;transform:translateY(-4px) scale(1.02);box-shadow:inset 0 0 0 1px var(--key-edge),0 16px 30px rgba(0,0,0,.16)}
.pebble.lifted{transform:translateY(-5px) scale(1.02)}
.pebble.enter{animation:pop .5s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(10px)}}
.pebble.leave,.trans.leave{opacity:0;transform:scale(.85);transition:opacity .22s ease-out,transform .22s ease-out;pointer-events:none}
.pebble.sel{height:102px;border-radius:14px 14px 0 0;background:var(--ink);color:var(--bg);box-shadow:none}
.pebble.sel .pb-time{color:var(--muted)}
.pebble.sel{z-index:5}
.pebble.sel[data-sty]{background:var(--panel);color:var(--ink);box-shadow:inset 1.5px 0 0 var(--ink),inset -1.5px 0 0 var(--ink),inset 0 1.5px 0 var(--ink)!important}
.pebble.sel[data-sty="solid"]{background:var(--hi)}
.pebble.sel[data-sty]::before{opacity:.7!important}
.drawer[data-sty] .stem{background:var(--pat,linear-gradient(transparent,transparent)),var(--panel);box-shadow:inset 1.5px 0 0 var(--ink),inset -1.5px 0 0 var(--ink)}
.drawer[data-sty="solid"] .stem{background:var(--hi)}
.pebble.active .pb-name::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:7px;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite}
.pb-head{display:flex;align-items:center;gap:7px;min-width:0;position:relative}
.pb-head .sw{width:8px;height:8px;border-radius:50%}
.pb-name{font-weight:500;font-size:15px;line-height:1.15;overflow:hidden;overflow-wrap:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pb-head{align-items:flex-start}
.pb-head .sw{margin-top:5px}
.pb-time{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--muted);white-space:nowrap;position:relative;margin-top:3px}
.pb-pomo{position:absolute;left:0;bottom:12px;height:2px;opacity:.5;transition:width .42s var(--ease)}

.pb-rz{position:absolute;top:0;right:0;bottom:0;width:14px;cursor:ew-resize}

.narrow{padding-left:9px;padding-right:9px}
.trans{position:absolute;top:62px;height:16px;box-sizing:border-box;border-radius:8px;background:radial-gradient(circle,var(--muted) 1.3px,transparent 1.8px) -2px 50%/var(--step,14px) 100% repeat-x;opacity:.75;cursor:pointer;touch-action:none;transition:left .42s var(--ease),width .42s var(--ease),height .38s var(--ease),top .38s var(--ease),background-color .2s}

.slot{position:absolute;top:34px;height:72px;box-sizing:border-box;border-radius:14px;border:1.5px dashed var(--muted);pointer-events:none;transition:left .18s var(--ease),width .18s var(--ease);z-index:1}
.dragtip{position:absolute;top:6px;z-index:8;transform:translateX(-50%);background:var(--screen);color:var(--screen-ink);border-radius:8px;padding:3px 9px;font-family:var(--f-mono);font-size:11px;white-space:nowrap;pointer-events:none;transition:left .18s var(--ease)}

.track.still .pebble,.track.still .trans,.track.still .hr,.track.still .calev,.track.still .nowline{transition:none!important}

/* drawer */
.drawer{position:relative;margin-top:-1px;border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.1fr) minmax(0,1.1fr);gap:22px;background:var(--panel);transform-origin:top center;align-items:start;animation:unfold .46s var(--ease)}
@keyframes unfold{from{clip-path:inset(0 0 100% 0 round 14px);opacity:.3}to{clip-path:inset(0 0 0 0 round 14px);opacity:1}}
.drawer>*{animation:rise .5s var(--ease) both}.drawer>*:nth-child(3){animation-delay:.04s}.drawer>*:nth-child(4){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.stem{position:absolute;top:-21px;height:21px;background:var(--ink);animation:none!important}
.drawer[data-kind="trans"] .stem{background:var(--ink)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.d-head{display:flex;gap:10px;align-items:flex-start}

.d-name:focus{outline:none;border-bottom-color:var(--ink)}
.x{font-size:20px;line-height:1;color:var(--muted);width:28px;height:28px;border-radius:50%;flex:none;transition:background .15s,color .15s}
.x:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--hov)}
.meta{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{color:var(--muted)}
.field input,.field select{font-size:16px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);min-width:0;transition:border-color .15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--ink)}
.reprow{display:flex;align-items:center;gap:10px;margin-top:2px}.reprow .mono{color:var(--muted);font-size:11px}
.lenrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lenrow input{width:58px;text-align:center;font-family:var(--f-mono);font-size:14px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:var(--bg)}
.sq{width:30px;height:30px;border-radius:10px;font-size:16px;background:linear-gradient(var(--key-a),var(--key-b));box-shadow:inset 0 0 0 1px var(--key-edge),0 1px 0 var(--key-edge);transition:transform .1s}
.sq:active{transform:translateY(1px)}
.switch{display:inline-flex;align-items:center;gap:8px;margin-left:10px;cursor:pointer}
.switch input{appearance:none;width:32px;height:18px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .25s var(--ease)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:left .3s var(--spring)}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{left:16px}
.links{display:flex;flex-wrap:wrap;gap:6px 16px}
.links button{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);transition:color .15s}
.links button:hover{color:var(--ink);text-decoration-color:var(--ink)}
.links .danger:hover{color:var(--red);text-decoration-color:var(--red)}

.list{min-width:0;display:flex;flex-direction:column;gap:6px}
.lh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:0 4px 7px;border-bottom:1px solid var(--line)}
.lh .t{font-size:16px;font-weight:500}
.lh .mono{color:var(--muted)}
.list.sess{background:var(--bg);border-radius:12px;padding:12px 10px 8px;box-shadow:inset 0 0 0 1px var(--hair)}
.list.sess .lh{border-bottom-color:transparent}
.list.droptarget{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
[data-role="sess"]{min-height:38px}
[data-role="sess"]:empty::before{content:"Drag tasks in from the list, or tap → beside one.";display:block;padding:8px 6px;color:var(--muted)}
.task{display:grid;grid-template-columns:14px 18px minmax(0,1fr) auto auto;align-items:start;gap:7px;padding:1px 4px;border-radius:8px;transition:background .15s ease-out}
.task>.handle{margin-top:3px}.task>input[type=checkbox]{margin-top:5px!important}.task>.due,.task>.acts{margin-top:3px}
.task:hover,.task:focus-within{background:var(--hi)}
.task.dragsrc{opacity:.25}
.task.insess .tt{color:var(--muted)}
.task.pop{animation:rowin .35s var(--ease)}
@keyframes rowin{from{opacity:0;transform:translateY(-4px)}}
.ph{height:30px;border-radius:8px;border:1px dashed var(--ink);transition:height .2s var(--ease)}
.rowghost{position:fixed;z-index:70;pointer-events:none;background:var(--panel);border-radius:8px;box-shadow:0 0 0 1px var(--line),0 14px 28px rgba(0,0,0,.14);list-style:none;transform:rotate(-.6deg)}
.handle{width:14px;height:22px;cursor:grab;touch-action:none;background:radial-gradient(circle,var(--muted) 1px,transparent 1.4px) 0 0/5px 5px;opacity:.3;transition:opacity .15s}
.task:hover .handle{opacity:.9}
.task input[type=checkbox]{appearance:none;width:16px;height:16px;border:1px solid var(--muted);border-radius:50%;margin:0;cursor:pointer;display:grid;place-content:center;transition:background .2s var(--ease),border-color .2s}
.task input[type=checkbox]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--panel);transform:scale(0);transition:transform .3s var(--spring)}
.task input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
.task input[type=checkbox]:checked::after{transform:scale(1)}
.tt{display:block;border:0;background:transparent;padding:4px 0;font:inherit;font-size:16px;line-height:1.3;min-width:0;width:100%;resize:none;overflow:hidden;color:inherit}
.tt:focus{outline:none}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.due{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:2px 7px;border-radius:6px;white-space:nowrap}
.due.empty{opacity:0;transition:opacity .15s}
.task:hover .due.empty,.task:focus-within .due.empty{opacity:.7}
.due.set{box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.due.soon{background:var(--ink);color:var(--bg)}
.due.over{background:var(--red);color:#fff}
.dueinput{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--bg);max-width:136px}
.acts{display:flex}
.act{color:var(--muted);font-size:15px;padding:2px 6px;border-radius:6px;line-height:1.2;transition:background .15s,color .15s}
.act:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--hov)}
.act.go{color:var(--ink);font-weight:600}
.act.in{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase}
.act.del{opacity:.3}
.task:hover .act.del,.task:focus-within .act.del{opacity:1}
@media (hover:none){.due.empty{opacity:.55}.act.del{opacity:.6}}
.addline{display:grid;grid-template-columns:14px 18px minmax(0,1fr);gap:7px;align-items:center;padding:1px 4px}
.addline span{grid-column:2;color:var(--muted);text-align:center}
.addline input{border:0;background:transparent;padding:6px 0;font-size:16px;min-width:0}
.addline input:focus{outline:none}
.recent{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.recent .mono{color:var(--muted);padding:0 4px 2px;display:block}
.prompts{grid-column:2/-1;list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prompts label{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.prompts label:hover{box-shadow:inset 0 0 0 1px var(--hov)}
.prompts input{appearance:none;width:16px;height:16px;border:1px solid var(--muted);border-radius:50%;margin:0;flex:none;transition:background .2s}
.prompts input:checked{background:var(--ink);border-color:var(--ink)}
.prompts input:checked + span{text-decoration:line-through;color:var(--muted)}

.actbox{grid-column:2/-1;display:flex;flex-direction:column;gap:14px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:66px;border-radius:12px;padding:10px 12px;text-align:left;background:linear-gradient(var(--key-a),var(--key-b));box-shadow:inset 0 0 0 1px var(--key-edge),0 1px 0 var(--key-edge);transition:transform .12s var(--ease),background .2s,color .2s}
.tile b{font-weight:500}
.tile .mono{color:var(--muted)}
.tile:hover{transform:translateY(-1px)}
.tile.on{background:var(--ink);color:var(--bg);box-shadow:none}
.tile.add{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted);justify-content:center}
/* compact activity buttons: one line, sized to their label */
.tiles{display:flex!important;flex-wrap:wrap;gap:6px!important}
.tile{flex-direction:row!important;align-items:baseline!important;justify-content:flex-start!important;gap:8px!important;min-height:0!important;padding:6px 11px!important;border-radius:9px!important;white-space:nowrap}
.tile .mono{font-size:11px}
.tile.add{padding:6px 12px!important}

/* master list */
.master{padding:22px;display:flex;flex-direction:column;gap:18px;animation:unfold .46s var(--ease)}
.master h2{margin:0;font-size:24px;font-weight:500;flex:1}

.plist{display:flex;flex-direction:column;gap:1px;position:sticky;top:16px}
.plgroup{display:flex;align-items:center;gap:7px;margin:16px 0 4px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.plgroup:first-child{margin-top:0}
.gsw{width:11px;height:11px;border-radius:50%;background:var(--pc);flex:none;transition:transform .2s var(--spring)}
.gsw:hover{transform:scale(1.25)}
.gname{flex:1;min-width:0;border:0;background:transparent;font-size:15px;font-weight:500;padding:2px 0}
.gname:focus{outline:none;text-decoration:underline;text-underline-offset:3px}
.gbtn{color:var(--muted);font-size:17px;width:24px;height:24px;border-radius:6px;line-height:1;flex:none}
.gbtn:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--hov)}
.pl-item{display:flex;align-items:center;gap:10px;border-radius:8px;padding:6px 8px 6px 18px;text-align:left;width:100%;transition:background .15s ease-out}
.pl-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-item .ct{color:var(--muted)}
.pl-item .warn{width:6px;height:6px;border-radius:1px;background:var(--red);flex:none}
.pl-item:hover{box-shadow:inset 0 0 0 1px var(--hov)}
.pl-item.open{background:var(--ink);color:var(--bg)}
.pl-item.open .ct{color:var(--muted)}
.newproj{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.newproj input,.newproj select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:15px;background:var(--bg);min-width:0}
.newproj div{display:flex;gap:8px;align-items:center}
.newproj select{flex:1}
.newproj .links{margin-top:4px}
.pill{font-size:14px;border-radius:10px;padding:5px 12px;white-space:nowrap;background:linear-gradient(var(--key-a),var(--key-b));box-shadow:inset 0 0 0 1px var(--key-edge),0 1px 0 var(--key-edge)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}
.cards:empty::before{content:"Choose a project on the left to pull out its list. Lists stay open, so you can add to several during one conversation.";color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;animation:pop .45s var(--spring);min-width:0;background:var(--bg)}
.card .d-head{align-items:center}
.card .d-name{font-size:20px}
.cmeta{display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:space-between;align-items:center;color:var(--muted)}

/* floating controls */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;z-index:40;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.08)}
.dock button{border-radius:10px;padding:7px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;min-width:36px;transition:background .15s}
.dock button:hover{box-shadow:inset 0 0 0 1px var(--hov)}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--screen);color:var(--screen-ink);border-radius:12px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;z-index:80;font-size:14px;max-width:calc(100% - 40px);animation:toastin .4s var(--spring);transform:translateX(-50%)}

footer{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;padding:6px 2px 0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1050px){.drawer{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.side{grid-column:1/-1}.prompts,.actbox{grid-column:1/-1}}
@media (max-width:760px){
  .drawer{grid-template-columns:minmax(0,1fr);padding:16px}
  .now{grid-template-columns:minmax(0,1fr)}
  .keys{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto}
  .key{flex-direction:row;align-items:center;justify-content:center;gap:6px;padding:9px}
  .scr-count{font-size:36px}.scr-name{font-size:20px}
  .dots{grid-template-columns:repeat(24,minmax(0,1fr))}
  .mgrid{grid-template-columns:minmax(0,1fr)}.plist{position:static}.cards{grid-template-columns:minmax(0,1fr)}
  .master{padding:16px}
}
/* v10: display controls, dot-matrix digits, project picker, joins */
.now{display:block}

.scr-name{font-size:20px;font-weight:700;letter-spacing:-.01em}
.mark{font-size:20px;font-weight:700}
nav.top button{font-size:13px}
.day b{font-size:14px;font-weight:700}
.chip{font-size:13px}
.d-title{display:flex;align-items:center;gap:9px;flex:1;min-width:0;text-align:left;font-size:20px;font-weight:700;line-height:1.2;padding:2px 6px 2px 0;border-radius:8px}
.d-title span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-title .chev{font-size:12px;color:var(--muted);transition:transform .3s var(--ease)}
.d-title:hover .chev,.d-title[aria-expanded="true"] .chev{color:var(--ink)}

.d-name{font-size:20px;font-weight:700}
.picker{position:absolute;z-index:30;left:14px;top:64px;width:min(340px,calc(100% - 28px));background:var(--panel);border-radius:14px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.14);padding:8px;animation:pick .32s var(--ease);transform-origin:top left}

.tpop{position:absolute;z-index:9;top:84px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--screen);color:var(--screen-ink);border-radius:10px;padding:5px 6px 5px 11px;font-size:11px;white-space:nowrap;animation:pick .28s var(--ease)}

/* a transition follows a pebble only when both it and the next pebble are work: breaks and exercise are transitions already */
function transLen(p,nx){if(nx===undefined){const ps=dayPebbles(p.date);nx=ps[ps.indexOf(p)+1]||null}
  if(!nx||p.trans===false)return 0;if((isAct(proj(p))||isAct(proj(nx)))&&p.trans!=='on')return 0;const st=ST();return p.tlen||(p.dur>=st.tThresh?st.tLong:st.tShort)}

function attTrans(p,nx){if(nx===undefined){const ps=dayPebbles(p.date);nx=ps[ps.indexOf(p)+1]||null}const tl=transLen(p,nx);return tl&&nx&&nx.start===p.start+p.dur+tl?tl:0}

function range(){let lo=ST().dayStart*60,hi=ST().dayEnd*60;dayPebbles(viewDate).forEach(p=>{lo=Math.min(lo,p.start-30);hi=Math.max(hi,p.start+p.dur+60)});if(isLive(viewDate)){const n=nowFor();lo=Math.min(lo,n);hi=Math.max(hi,n+30)}return [Math.floor(lo/60)*60,Math.ceil(hi/60)*60]}
const LATE=300,DAYMAX=1440+LATE;/* a day can run on until 5am the next morning */
function LIVE(){const t=nowMin();if(t<LATE){const y=shift(TODAY(),-1);if(S.pebbles.some(p=>p.date===y&&p.start+p.dur+transLen(p)>1440))return {date:y,off:1440}}return {date:TODAY(),off:0}}
const isLive=d=>d===LIVE().date,nowFor=()=>nowMin()+LIVE().off;
function current(){
  const L=LIVE(),t=nowMin()+L.off,ps=dayPebbles(L.date);
  for(let i=0;i<ps.length;i++){const p=ps[i],end=p.start+p.dur,tl=attTrans(p,ps[i+1]||null);
    if(t>=p.start&&t<end)return {type:'pebble',p,next:ps[i+1]};
    if(tl&&t>=end&&t<end+tl)return {type:'trans',p,next:ps[i+1]}}
  return {type:'free',next:ps.find(p=>p.start>t)};
}
function needsTime(){
  const today=TODAY(),we=shift(weekStart(viewDate),6);if(we<today)return [];const nm=nowMin(),out=[];
  Object.values(S.projects).forEach(pr=>{if(isAct(pr))return;
    openOf(pr).forEach(t=>{if(!t.due||t.due>we)return;const until=t.due<today?today:t.due;
      const booked=S.pebbles.some(p=>p.pid===pr.id&&p.date<=until&&(p.date>today||(p.date===today&&p.start+p.dur>nm)));
      if(!booked)out.push({pr,t})})});

  if(nx){const target=Math.ceil((end+base)/5)*5,gap=target-end;moved=Math.max(0,nx.start-target);
    if(gap>0){p.trans=(isAct(proj(p))||isAct(proj(nx)))?'on':true;p.tlen=gap}else{p.trans=false;delete p.tlen}
    if(moved)ps.forEach(q=>{if(q.start>p.start)q.start-=moved})}
  reflow(p.date);
  save();renderTrack();renderDays();updatePanelTime();prevActive=null;renderStatus();renderAlerts();if(!isAct(proj(p)))bigTick();
  toast(nx?`Finished early. ${proj(nx).name} now starts at ${fmt(nx.start)}.`:'Finished early.',()=>{keep.forEach(k=>{const i=S.pebbles.findIndex(q=>q.id===k.id);if(i>=0)S.pebbles[i]=k});save();renderTrack();renderDays();updatePanelTime();renderStatus()});
}

let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}

const BUF={},BUFP={};
function loadSound(n){if(!n||n==='none')return Promise.resolve(null);if(BUF[n])return Promise.resolve(BUF[n]);const ctx=audio();if(!ctx)return Promise.resolve(null);
  if(!BUFP[n])BUFP[n]=fetch('sounds/'+n+'.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(ab=>new Promise((ok,no)=>ctx.decodeAudioData(ab,ok,no))).then(b=>BUF[n]=b).catch(()=>{delete BUFP[n];return null});
  return BUFP[n]}

['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(preloadSounds,0),{once:true,capture:true}));
function playSound(name,force){const sn=ST().snd;if((!sn.on&&!force)||!name||name==='none')return;const ctx=audio();if(!ctx)return;
  loadSound(name).then(buf=>{if(!buf)return;const src=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=Math.max(0,Math.min(1,sn.vol));src.buffer=buf;src.connect(g);g.connect(ctx.destination);src.start()})}

  const li=document.createElement('li');li.className='note';li.dataset.nid=n.id;const pr=n.pid&&S.projects[n.pid];let tag='';
  if(view.ctx==='day')tag=pr?`<button class="ntag on"${gA(pr)} data-tag title="In ${esc(pr.name)}’s notes"><span class="sw"></span><span>${esc(pr.name)}</span></button>`:`<button class="ntag" data-tag title="Add to a project’s notes">tag</button>`;
  else if(n.origin!=='project'||n.date!==TODAY())tag=`<span class="ndate mono">${dayShort(n.date)}</span>`;
  li.innerHTML=`<span class="nb"></span><textarea class="tt" rows="1" aria-label="Note">${esc(n.text)}</textarea>${tag}`;
  const ta=li.querySelector('.tt');
  ta.oninput=()=>{n.text=ta.value;fit(ta);document.querySelectorAll(`[data-nid="${n.id}"] .tt`).forEach(x=>{if(x!==ta){x.value=n.text;fit(x)}});save()};
  ta.onkeydown=e=>{const items=view.items(),i=items.indexOf(n);
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const c=ta.selectionStart,rest=n.text.slice(c);n.text=n.text.slice(0,c);const nn=newNote(view,rest);S.notes.splice(S.notes.indexOf(n)+1,0,nn);view.changed(nn.id,0)}
    else if(e.key==='Backspace'&&ta.value===''){e.preventDefault();S.notes=S.notes.filter(x=>x!==n);view.changed(i>0?items[i-1].id:null);if(i===0)view.box.querySelector('[data-nadd]').focus()}
    else if(e.key==='ArrowUp'&&ta.selectionStart===0&&i>0){e.preventDefault();focusNote(view,items[i-1].id)}
    else if(e.key==='ArrowDown'&&ta.selectionEnd===ta.value.length){e.preventDefault();if(i<items.length-1)focusNote(view,items[i+1].id);else view.box.querySelector('[data-nadd]').focus()}};
  const tb=li.querySelector('[data-tag]');if(tb)tb.onclick=()=>tagPick(tb,n);
  return li;
}
function tagPick(anchor,n){
  closeConfirm();const r=anchor.getBoundingClientRect();const c=document.createElement('div');c.className='confirm tagpick';c.setAttribute('role','dialog');
  let h=`<button class="pk-i${n.pid?'':' cur'}" data-p="">no project</button>`;

  c.style.left=Math.max(12,Math.min(window.innerWidth-c.offsetWidth-12,r.right-c.offsetWidth))+'px';c.style.top=Math.min(window.innerHeight-c.offsetHeight-12,r.bottom+6)+'px';
  c.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;n.pid=b.dataset.p||null;n.dayHidden=false;closeConfirm();save();notesViews.forEach(v=>v.render())};
  c.onkeydown=e=>{if(e.key==='Escape'){e.stopPropagation();closeConfirm()}};setTimeout(()=>document.addEventListener('pointerdown',confirmOutside,true),0);
}
function clearNotes(view){
  const items=view.items();if(!items.length)return;const before=JSON.stringify(S.notes),now=Date.now(),archived=[];
  items.forEach(n=>{if(view.ctx==='day'&&n.pid&&S.projects[n.pid]){n.dayHidden=true}else{if((n.text||'').trim())archived.push({id:n.id,at:n.at||parseIso(n.date).getTime()});archiveNote(n,now)}});
  save();notesViews.forEach(v=>v.render());

/* ---------- history view ---------- */
let histQ='',histMore=1;
function renderHistory(){
  slot.innerHTML=`<section class="histp box" aria-label="History"><div class="d-head"><h2>history</h2><input id="histQ" class="hq" placeholder="search" value="${esc(histQ)}" aria-label="Search history"><button class="x" id="histClose" aria-label="Close">×</button></div><div id="histList" class="hlist"></div></section>`;
  $('#histClose').onclick=()=>openPane('history');const q=$('#histQ');q.oninput=()=>{histQ=q.value;histMore=1;drawHist()};
  $('#histList').onclick=histClick;drawHist();Promise.all((S.histMonths||[]).map(loadHistMonth)).then(drawHist);
}
function histItems(){
  const items=[],liveT=new Set(),liveN=new Set(S.notes.map(n=>n.id));
  Object.values(S.projects).forEach(p=>p.tasks.forEach(t=>{liveT.add(t.id);if(t.done&&t.doneAt)items.push({k:'task',live:true,id:t.id,text:t.text,pid:p.id,pname:p.name,gname:groupName(p.group),gc:gCol(p),day:isoDay(new Date(t.doneAt)),at:t.doneAt})}));
  (S.histMonths||[]).forEach(m=>{const h=HIST[m]||hm(m);h.tasks.forEach(t=>{if(!liveT.has(t.id))items.push(Object.assign({k:'task',day:isoDay(new Date(t.at))},t))});h.notes.forEach(n=>{if(!liveN.has(n.id))items.push(Object.assign({k:'note',day:n.date},n))})});
  return items;
}
function drawHist(){
  const el=document.getElementById('histList');if(!el)return;const q=histQ.trim().toLowerCase();
  let items=histItems();if(q)items=items.filter(x=>(x.text+' '+(x.pname||'')+' '+(x.gname||'')).toLowerCase().includes(q));
  items.sort((a,b)=>a.day===b.day?(b.at||0)-(a.at||0):(a.day<b.day?1:-1));
  const lim=200*histMore,shown=items.slice(0,lim);
  if(!shown.length){el.innerHTML=`<div class="hempty mono">${q?'nothing matches':'nothing yet'}</div>`;return}
  let h='',cur='';
  shown.forEach(x=>{if(x.day!==cur){if(cur)h+='</ul></div>';cur=x.day;h+=`<div class="hday"><div class="hd mono">${parseIso(x.day).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:x.day.slice(0,4)!==TODAY().slice(0,4)?'numeric':undefined}).toLowerCase()}</div><ul>`}
    const can=x.k==='task'?(x.live||!!S.projects[x.pid]):true;
    h+=`<li class="hi ${x.k}"><span class="tk">${x.k==='task'?'✓':'¶'}</span><span class="tx">${esc(x.text)}</span>${x.pname?`<span class="hp"${x.gc!=null?` data-g="${x.gc}"`:''}><span class="sw"></span>${esc(x.pname)}</span>`:'<span></span>'}<span class="ht mono">${x.k==='task'?fmt(new Date(x.at).getHours()*60+new Date(x.at).getMinutes()):'note'}</span>${can?`<button class="hbtn" data-${x.k==='task'?'reopen':'restore'}="${x.id}" data-at="${x.at}">${x.k==='task'?'reopen':'restore'}</button>`:'<span></span>'}</li>`});
  h+='</ul></div>';if(items.length>lim)h+=`<button class="hmore" data-more>show more</button>`;el.innerHTML=h;
}
function histClick(e){
  if(e.target.closest('[data-more]')){histMore++;drawHist();return}
  const ro=e.target.closest('[data-reopen]');
  if(ro){const id=ro.dataset.reopen,at=+ro.dataset.at;let done=false;
    Object.values(S.projects).forEach(p=>{const t=p.tasks.find(x=>x.id===id);if(t){setDone(t,false);p.tasks.splice(p.tasks.indexOf(t),1);p.tasks.splice(openOf(p).length,0,t);done=true}});
    if(!done){const m=monthOf(at),it=(hm(m).tasks.find(x=>x.id===id));const p=it&&S.projects[it.pid];if(p){p.tasks.splice(openOf(p).length,0,{id,text:it.text,done:false,doneAt:null,due:it.due||null});removeHist('task',id,at);done=true}}
    if(done){save();drawHist();toast('Task reopened');renderAlerts();renderPlist()}return}
  const rs=e.target.closest('[data-restore]');
  if(rs){const id=rs.dataset.restore,at=+rs.dataset.at,it=hm(monthOf(at)).notes.find(x=>x.id===id);if(!it)return;
    S.notes.push({id,date:it.date,text:it.text,pid:it.pid&&S.projects[it.pid]?it.pid:null,origin:it.origin||undefined,at:it.created||it.at});removeHist('note',id,at);save();drawHist();toast('Note restored to '+dayShort(it.date));renderDayNotes(true)}
}
